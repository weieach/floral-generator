<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Floral Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-style="lupi">
  <header class="topnav">
    <span class="brand">Floral Generator</span>
    <nav class="tabs" role="tablist" aria-label="Visual direction" id="tabs"></nav>
  </header>

  <main class="app">
    <section class="stage" role="tabpanel">
      <figure class="specimen">
        <div class="tile-wrap">
          <div class="tile" id="tile" role="img" aria-label="Generated radial flower"></div>
        </div>
        <figcaption class="caption">
          <span id="seed-label">No. —</span>
          <span id="fold-note"></span>
        </figcaption>
      </figure>
    </section>

    <aside class="panel">
      <div class="panel-main">
        <header>
          <h1 id="style-title">0. Giorgia Lupi (trial)</h1>
          <p class="lede" id="style-lede"></p>
        </header>

        <div class="control">
          <div class="control-head">
            <label for="folds">Petals</label>
            <span class="readout"><svg id="fold-icon" viewBox="-12 -12 24 24" aria-hidden="true"></svg><output id="folds-value" for="folds">12</output></span>
          </div>
          <input type="range" id="folds" min="3" max="20" step="1" value="12">
          <div class="hint-row">
            <p class="hint">The flower is symmetrical across each petal.</p>
            <span class="keys" aria-hidden="true"><kbd>←</kbd><kbd>→</kbd></span>
          </div>
        </div>

        <div class="actions">
          <button id="randomize" class="primary" type="button">Randomize <kbd>Space</kbd></button>
          <button id="back" class="ghost" type="button" disabled aria-label="Previous design">← Back</button>
        </div>

        <div class="grid-control">
          <div class="toggle-row">
            <label class="toggle">
              <input type="checkbox" id="lock-folds" checked>
              <span class="switch" aria-hidden="true"></span>
              Lock petals when randomizing
            </label>
            <span class="keys" aria-hidden="true"><kbd>L</kbd></span>
          </div>
          <div class="range-row" id="fold-range" hidden>
            Range:
            <input type="number" id="fold-min" min="3" max="20" step="1" aria-label="Fewest petals when randomizing">
            –
            <input type="number" id="fold-max" min="3" max="20" step="1" aria-label="Most petals when randomizing">
            petals
            <button id="reset-range" class="text-button" type="button">Reset</button>
          </div>
          <div class="toggle-row">
            <label class="toggle">
              <input type="checkbox" id="grid">
              <span class="switch" aria-hidden="true"></span>
              Show ring grid
            </label>
            <span class="info" id="grid-info">
              <button class="info-btn" type="button" aria-label="About the ring grid" aria-describedby="grid-tip" aria-expanded="false">i</button>
              <span class="tip" role="tooltip" id="grid-tip">With grid on, drag the rings to resize pattern</span>
            </span>
            <span class="keys" aria-hidden="true"><kbd>G</kbd></span>
          </div>
          <button id="reset-rings" class="text-button" type="button" hidden>Reset rings</button>
        </div>

        <section class="recipe" aria-live="polite" hidden>
          <h2>Specimen</h2>
          <dl>
            <dt>III · Petal</dt><dd id="r-petal"></dd>
            <dt>II · Middle</dt><dd id="r-middle"></dd>
            <dt>I · Core</dt><dd id="r-core"></dd>
            <dt>Palette</dt><dd class="palette"><span id="swatches"></span><span id="r-palette"></span></dd>
          </dl>
        </section>
      </div>

      <div class="export">
        <span>Export</span>
        <button id="dl-svg" type="button">SVG</button>
        <button id="dl-png" type="button">PNG</button>
      </div>
    </aside>
  </main>

  <!-- "All style overview": every direction in a 2×2 grid, same seed -->
  <section class="overview" role="tabpanel" aria-labelledby="tab-all">
    <div class="ov-grid" id="overview-grid"></div>
    <div class="actions ov-actions">
      <button id="ov-randomize" class="primary" type="button">Randomize <kbd>Space</kbd></button>
      <button id="ov-back" class="ghost" type="button" disabled aria-label="Previous designs">← Back</button>
    </div>
  </section>

  <script src="flora.js"></script>
  <script src="butterfly.js"></script>
  <script src="paper.js"></script>
  <script src="paint.js"></script>
  <script src="app.js"></script>
</body>
</html>
